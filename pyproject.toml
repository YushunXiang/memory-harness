[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-harness"
version = "0.1.0"
description = "Composable memory programs for embodied policy experiments"
requires-python = ">=3.11"
dependencies = ["numpy", "Pillow", "requests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
